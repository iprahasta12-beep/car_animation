<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Crash Preview</title>
<style>
  :root { --bg:#14161b; --panel:#1b1e25; --line:#2c3039; --fg:#e9eaee; --dim:#8d93a0; --acc:#ff4f8b; --acc2:#4ea1ff; --gold:#ffcf4a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns:268px 1fr 268px; height:100%; }
  aside { background:var(--panel); border-color:var(--line); border-style:solid; border-width:0; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:14px; }
  #left { border-right-width:1px; --side:#ff4f8b; }
  #right { border-left-width:1px; --side:#4ea1ff; }
  h1 { margin:0; font-size:14px; }
  h1 small { display:block; color:var(--dim); font-weight:400; font-size:11px; margin-top:2px; }
  .lbl { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .lbl i { font-style:normal; width:10px; height:10px; border-radius:50%; display:inline-block; }
  .grp { display:flex; flex-direction:column; gap:6px; }
  .cars { display:flex; flex-direction:column; gap:8px; }
  .pv { position:relative; height:300px; flex:none; border-radius:10px; overflow:hidden; border:1px solid var(--line);
        background:radial-gradient(circle at 50% 45%, #2e3440, #171a20 75%); }
  .pv canvas { position:absolute; inset:0; width:100% !important; height:100% !important; }
  .pv .tag { position:absolute; left:8px; bottom:6px; font-size:11px; color:var(--dim); pointer-events:none; }
  .pv .tag b { color:var(--side); }
  .pick { display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(2, 52px); gap:6px; }
  .pick button { border:1px solid var(--line); background:#262a33; color:var(--fg); border-radius:9px; padding:0 2px; font:700 13px system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; cursor:pointer; }
  .pick button:hover { border-color:var(--dim); }
  .pick button.on { background:var(--side); border-color:var(--side); color:#fff; }
  .pick button.na { color:#5d6370; border-style:dashed; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chips button { border:1px solid var(--line); background:transparent; color:var(--dim); border-radius:999px; padding:3px 9px; font:inherit; font-size:11px; cursor:pointer; }
  .chips button:hover, .chips button.on { color:var(--fg); border-color:var(--side, var(--acc)); }
  #mid { display:grid; grid-template-rows:1fr auto auto; min-width:0; min-height:0; }
  #wrap { container-type:size; min-width:0; min-height:0; display:grid; place-items:center; padding:12px; }
  #stage { position:relative; width:min(100cqw - 24px, (100cqh - 24px) * 16 / 9); aspect-ratio:16 / 9; overflow:hidden; background:#000; border-radius:6px; box-shadow:0 0 0 1px var(--line), 0 10px 30px #0008; }
  #stage canvas { position:absolute; inset:0; }
  #bar { display:flex; flex-wrap:nowrap; gap:10px; align-items:center; justify-content:center; height:58px; padding:0 12px; overflow:hidden; background:var(--panel); border-top:1px solid var(--line); }
  .anim { display:flex; gap:6px; }
  .anim button { border:1px solid var(--line); background:#262a33; color:var(--fg); padding:7px 14px; border-radius:8px; cursor:pointer; font:inherit; font-weight:700; letter-spacing:.03em; }
  .anim button:hover { border-color:var(--dim); }
  .anim button.on { background:var(--fg); color:#14161b; }
  .anim button.crash { background:linear-gradient(#ff6a3d,#c8281a); border-color:#ff9a7a; color:#fff; }
  .anim button.crash.on { outline:2px solid #fff; outline-offset:2px; }
  button.b, label.b { border:1px solid var(--line); background:#262a33; color:var(--fg); padding:7px 12px; border-radius:8px; cursor:pointer; font:inherit; text-align:center; }
  button.b:hover, label.b:hover { border-color:var(--dim); }
  label.b input { display:none; }
  .speed { display:flex; align-items:center; gap:8px; }
  .speed input { width:110px; accent-color:var(--acc); }
  .speed span { width:40px; font-variant-numeric:tabular-nums; }
  .sep { width:1px; height:24px; background:var(--line); }
  .seg { display:grid; grid-template-columns:repeat(3, 1fr); background:#0004; border-radius:8px; padding:3px; gap:3px; }
  .seg button { border:0; background:transparent; color:var(--dim); padding:6px 4px; border-radius:6px; cursor:pointer; font:inherit; font-weight:600; font-size:12px; }
  .seg button.on { background:#3a3f4b; color:#fff; }
  select.s { width:100%; background:#0004; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
  .note { color:var(--dim); font-size:11px; line-height:1.5; }
  .keys b { color:var(--fg); background:#0005; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-weight:600; }
  #state { color:var(--dim); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; flex:0 1 270px; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #bar > * { flex-shrink:0; }
  #bar > #state { flex-shrink:1; }
  #state b { color:var(--gold); }
  #toast { position:fixed; left:50%; top:24px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:8px; display:none; z-index:9; }

  /* ================= GAME UI (code, design px @ 1920×1080 frame) ================= */
  #ui { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; pointer-events:none; z-index:2; }
  #uistate { display:flex; align-items:center; justify-content:center; gap:12px; padding:8px 12px; background:var(--panel); border-top:1px solid var(--line); flex-wrap:nowrap; overflow:hidden; }
  #uistate .lbl { white-space:nowrap; }
  #uistate .seg { display:flex; }
  #uistate .seg button { padding:6px 12px; }
  #uistate select.s { width:auto; min-width:130px; }
  .gbar { --u-bg1:#2b353c; --u-bg2:#182025; --u-line:#46535c; --u-tile1:#2c363d; --u-tile2:#1d252b; --u-teal:#1fb491; --u-gold:#ffc53d;
          position:absolute; left:50%; bottom:40px; transform:translateX(-50%); pointer-events:auto; user-select:none;
          display:flex; align-items:center; gap:14px; height:118px; padding:0 16px; border-radius:60px;
          background:linear-gradient(var(--u-bg1), var(--u-bg2)); border:4px solid #11171b;
          box-shadow:0 0 0 2px var(--u-line) inset, 0 10px 30px #0009;
          font-family:"Nunito","Baloo 2","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif; color:#fff; }
  .gbar svg { display:block; }
  .tile { border-radius:22px; background:linear-gradient(var(--u-tile1), var(--u-tile2)); border:3px solid #3c4851; box-shadow:0 3px 0 #0b1013, 0 0 0 1px #0006 inset; }
  .ubtn { cursor:pointer; transition:transform .08s, filter .12s, box-shadow .12s, border-color .12s; color:#fff; font:inherit; padding:0; }
  .ubtn.icon { width:92px; height:88px; display:grid; place-items:center; }
  .ubtn.icon svg { width:48px; height:48px; }
  .money { height:94px; display:flex; align-items:center; padding:0 34px; gap:34px; }
  .money .col { text-align:center; min-width:190px; }
  .money .k { font-size:24px; font-weight:800; color:#9fb0bb; letter-spacing:.02em; line-height:1; }
  .money .v { font-size:40px; font-weight:900; line-height:1.1; margin-top:6px; font-variant-numeric:tabular-nums; }
  .money .v.win { color:var(--u-gold); }
  .money .div { width:3px; height:54px; background:#46535c; border-radius:2px; }
  .bet { height:94px; display:flex; align-items:center; gap:14px; padding:0 10px; }
  .bet .mid { text-align:center; min-width:120px; }
  .bet .k { font-size:24px; font-weight:800; color:#9fb0bb; line-height:1; }
  .bet .k svg { display:inline; width:16px; height:12px; vertical-align:2px; margin-left:4px; }
  .bet .v { font-size:38px; font-weight:900; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; }
  .pm { width:68px; height:66px; border-radius:16px; display:grid; place-items:center; border:2px solid #24303a;
        background:linear-gradient(#6f8294, #455565); box-shadow:0 4px 0 #1a232b, 0 2px 0 #ffffff30 inset; }
  .pm svg { width:30px; height:30px; }
  .auto { height:88px; display:flex; align-items:center; gap:14px; padding:0 22px 0 18px; border-color:var(--u-teal); }
  .auto svg { width:50px; height:50px; }
  .auto span { font-size:27px; font-weight:900; line-height:1.05; text-align:left; }
  .auto.on { background:linear-gradient(#1c6a58, #0f3e34); box-shadow:0 0 18px #1fb49166, 0 3px 0 #0b1013; }
  .spinwrap { width:160px; height:118px; position:relative; }
  .spin { position:absolute; left:50%; top:50%; width:164px; height:164px; margin:-82px 0 0 -82px; border-radius:50%;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
          background:radial-gradient(circle at 50% 35%, #2fd1aa, #129a7a 55%, #0b6e57); border:6px solid #11171b;
          box-shadow:0 0 0 5px #1fb491 inset, 0 0 0 9px #0d5e4b inset, 0 8px 0 #07120f, 0 10px 26px #000a; }
  .spin svg { width:84px; height:84px; }
  .spin span { font-size:30px; font-weight:900; letter-spacing:.06em; line-height:1; text-shadow:0 2px 0 #0a5a47; }
  .spin .cnt, .spin .lbl2 { display:none; }
  .spin.autoc svg, .spin.autoc .lbl1 { display:none; }
  .spin.autoc .cnt { display:block; font-size:var(--cnt, 14px); font-weight:900; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 3px 0 #0a5a47; }
  .spin.autoc .lbl2 { display:block; font-size:var(--cnt2, 11px); letter-spacing:.12em; opacity:.9; }
  .spin.autoc.busy svg { animation:none; }
  .autowrap { position:relative; }
  .pop { position:absolute; left:50%; bottom:calc(100% + 26px); transform:translateX(-50%) translateY(8px); width:300px; padding:16px; border-radius:20px;
         background:linear-gradient(#2b353c, #182025); border:3px solid #11171b; box-shadow:0 0 0 2px #46535c inset, 0 16px 40px #000a;
         opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; z-index:10; }
  .pop.open { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .pop::after { content:""; position:absolute; left:50%; bottom:-13px; width:22px; height:22px; margin-left:-11px; transform:rotate(45deg);
         background:#182025; border-right:3px solid #11171b; border-bottom:3px solid #11171b; }
  .pop .pt { font-size:20px; font-weight:900; color:#9fb0bb; letter-spacing:.06em; text-align:center; margin-bottom:12px; }
  .pop .pg { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .pop .pg button, .pop .px { font:inherit; font-weight:900; font-size:26px; color:#fff; height:58px; border-radius:14px; cursor:pointer;
         border:2px solid #24303a; background:linear-gradient(#6f8294, #455565); box-shadow:0 4px 0 #1a232b, 0 2px 0 #ffffff30 inset; }
  .pop .pg button:hover { filter:brightness(1.15); border-color:#1fb491; }
  .pop .pg button:active, .pop .px:active { transform:translateY(3px); box-shadow:0 1px 0 #1a232b; }
  .pop .px { width:100%; margin-top:12px; height:46px; font-size:18px; background:transparent; border-color:#46535c; box-shadow:none; color:#9fb0bb; }
  .spin.busy svg { animation:rot .7s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .turbo { height:88px; display:flex; align-items:center; gap:10px; padding:0 24px 0 18px; }
  .turbo svg { width:40px; height:54px; }
  .turbo span { font-size:30px; font-weight:900; }
  .turbo.on { border-color:var(--u-gold); box-shadow:0 0 18px #ffc53d55, 0 3px 0 #0b1013; }
  .turbo.on span { color:var(--u-gold); }

  /* states — real (:hover/:active) + forced preview classes (.f-hover/.f-press/.f-dis) */
  .ubtn:not(.dis):not(.f-dis):hover, .ubtn.f-hover { filter:brightness(1.18); border-color:#6b7d89; }
  .pm:not(.dis):not(.f-dis):hover, .pm.f-hover { border-color:#8fa3b5; }
  .auto:not(.dis):hover, .auto.f-hover { border-color:#4ff0c6; box-shadow:0 0 14px #1fb49166, 0 3px 0 #0b1013; }
  .spin:not(.dis):not(.f-dis):hover, .spin.f-hover { filter:brightness(1.12); box-shadow:0 0 0 5px #4ff0c6 inset, 0 0 0 9px #0d5e4b inset, 0 8px 0 #07120f, 0 0 34px #2fd1aa99; }
  .ubtn:not(.dis):not(.f-dis):not(.f-hover):active, .ubtn.f-press { transform:translateY(3px) scale(.96); filter:brightness(.82); box-shadow:0 0 0 #000, 0 3px 8px #0008 inset; }
  .spin:not(.dis):not(.f-dis):not(.f-hover):active, .spin.f-press { transform:translateY(4px) scale(.95); filter:brightness(.85);
       box-shadow:0 0 0 5px #1fb491 inset, 0 0 0 9px #0d5e4b inset, 0 2px 0 #07120f, 0 4px 12px #000a; }
  .ubtn.dis, .ubtn.f-dis { filter:grayscale(.85) brightness(.6); cursor:default; }
  .ubtn.f-lock { pointer-events:none; }
</style>
</head>

  <aside id="left">
    <h1>Car Crash <small>Spine 4.2 · Pixi v8 · offline</small></h1>
    <div class="grp">
      <div class="lbl">Car A · from west <i style="background:#ff4f8b"></i></div>
      <div class="pv" id="pvA"><div class="tag" id="tagA"></div></div>
      <div class="chips" id="animsA"></div>
      <div class="note">Chip = play in this preview only. Mode buttons sync both.</div>
    </div>
    <div class="grp" style="margin-top:auto">
      <div class="lbl">Car A select</div>
      <div class="pick" id="pickA"></div>
    </div>

  <div id="mid">

.08 3 10.08H3.09C3.42099 10.0723 3.742 9.96512 4.0113 9.77251C4.28059 9.5799 4.48572 9.31074 4.6 9C4.73312 8.69838 4.77282 8.36381 4.714 8.03941C4.65519 7.71502 4.50054 7.41568 4.27 7.18L4.21 7.12C4.02405 6.93425 3.87653 6.71368 3.77588 6.47088C3.67523 6.22808 3.62343 5.96783 3.62343 5.705C3.62343 5.44217 3.67523 5.18192 3.77588 4.93912C3.87653 4.69632 4.02405 4.47575 4.21 4.29C4.39575 4.10405 4.61632 3.95653 4.85912 3.85588C5.10192 3.75523 5.36217 3.70343 5.625 3.70343C5.88783 3.70343 6.14808 3.75523 6.39088 3.85588C6.63368 3.95653 6.85425 4.10405 7.04 4.29L7.1 4.35C7.33568 4.58054 7.63502 4.73519 7.95941 4.794C8.28381 4.85282 8.61838 4.81312 8.92 4.68H9C9.29577 4.55324 9.54802 4.34276 9.72569 4.07447C9.90337 3.80618 9.99872 3.49179 10 3.17V3C10 2.46957 10.2107 1.96086 10.5858 1.58579C10.9609 1.21071 11.4696 1 12 1C12.5304 1 13.0391 1.21071 13.4142 1.58579C13.7893 1.96086 14 2.46957 14 3V3.09C14.0013 3.41179 14.0966 3.72618 14.2743 3.99447C14.452 4.26276 14.7042 4.47324 15 4.6C15.3016 4.73312 15.6362 4.77282 15.9606 4.714C16.285 4.65519 16.5843 4.50054 16.82 4.27L16.88 4.21C17.0657 4.02405 17.2863 3.87653 17.5291 3.77588C17.7719 3.67523 18.0322 3.62343 18.295 3.62343C18.5578 3.62343 18.8181 3.67523 19.0609 3.77588C19.3037 3.87653 19.5243 4.02405 19.71 4.21C19.896 4.39575 20.0435 4.61632 20.1441 4.85912C20.2448 5.10192 20.2966 5.36217 20.2966 5.625C20.2966 5.88783 20.2448 6.14808 20.1441 6.39088C20.0435 6.63368 19.896 6.85425 19.71 7.04L19.65 7.1C19.4195 7.33568 19.2648 7.63502 19.206 7.95941C19.1472 8.28381 19.1869 8.61838 19.32 8.92V9C19.4468 9.29577 19.6572 9.54802 19.9255 9.72569C20.1938 9.90337 20.5082 9.99872 20.83 10H21C21.5304 10 22.0391 10.2107 22.4142 10.5858C22.7893 10.9609 23 11.4696 23 12C23 12.5304 22.7893 13.0391 22.4142 13.4142C22.0391 13.7893 21.5304 14 21 14H20.91C20.5882 14.0013 20.2738 14.0966 20.0055 14.2743C19.7372 14.452 19.5268 14.7042 19.4 15Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="white"/></svg>
          </button>
          <div class="tile money">
            <div class="col"><div class="k">BALANCE</div><div class="v" id="uBal">$1,000.00</div></div>
            <div class="div"></div>
            <div class="col"><div class="k">WIN</div><div class="v win" id="uWin">$0.00</div></div>
          </div>
          <div class="tile bet">
            <button class="ubtn pm" data-ui="minus" title="Bet −"><svg viewBox="0 0 30 30"><rect x="4" y="11.5" width="22" height="7" rx="3" fill="#fff"/></svg></button>
            <div class="mid"><div class="k">BET<svg viewBox="0 0 16 12"><path d="M1 1h14L8 11z" fill="#fff"/></svg></div><div class="v" id="uBet">$1.00</div></div>
            <button class="ubtn pm" data-ui="plus" title="Bet +"><svg viewBox="0 0 30 30"><rect x="4" y="11.5" width="22" height="7" rx="3" fill="#fff"/><rect x="11.5" y="4" width="7" height="22" rx="3" fill="#fff"/></svg></button>
          </div>
          <div class="autowrap">
            <button class="ubtn tile auto" data-ui="auto" title="Auto play">
            <svg viewBox="0 0 50 50"><path d="M9.5 18A17 17 0 1 1 8 27" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M3.5 13.5l7.5 6.5 5-8.5z" fill="#fff"/><path d="M20 16.5v17l13.5-8.5z" fill="#fff"/></svg>
            <span>AUTO<br>PLAY</span>
          </button>
            <div class="pop" id="autoPop" role="dialog" aria-label="Auto spins">
              <div class="pt">AUTO SPINS</div>
              <div class="pg"><button data-n="10">10</button><button data-n="25">25</button><button data-n="50">50</button><button data-n="100">100</button><button data-n="250">250</button><button data-n="500">500</button></div>
              <button class="px" id="autoCancel">Cancel</button>
            </div>
          </div>
          <div class="spinwrap">
            <button class="ubtn spin" data-ui="spin" title="Spin (Enter)">
              <svg viewBox="0 0 96 96"><g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M22 44a27 27 0 0 1 46-17"/><path d="M74 52a27 27 0 0 1-46 17"/></g><path d="M74 12v24H50z" fill="#fff"/><path d="M22 84V60h24z" fill="#fff"/></svg>
              <span class="lbl1">SPIN</span>
              <b class="cnt" id="autoCnt">0</b><span class="lbl2">STOP</span>
            </button>
          </div>
          <button class="ubtn tile turbo" data-ui="turbo" title="Turbo">
            <svg viewBox="0 0 40 54"><path d="M24 2L4 31h13l-4 21 23-31H23z" fill="#ffc53d" stroke="#b8860b" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span>TURBO</span>
          </button>
        </div>
      </div>
    </div>
    </div>
    <div id="uistate">
      <div class="lbl">UI state</div>
      <div class="seg" id="uiState">
        <button data-st="live" class="on">Live</button><button data-st="normal">Normal</button><button data-st="hover">Hover</button><button data-st="press">Click</button><button data-st="dis">Disabled</button>
      </div>
      <select class="s" id="uiTarget">
        <option value="all">All buttons</option>
        <option value="info">Info</option><option value="settings">Settings</option>
        <option value="minus">Bet −</option><option value="plus">Bet +</option>
        <option value="auto">Auto play</option><option value="spin">Spin</option><option value="turbo">Turbo</option>
      </select>
    </div>
    <div id="bar">
      <div class="anim" id="modes">
        <button data-m="idle" title="I">IDLE</button>
        <button data-m="run" title="R">RUN</button>
        <button data-m="crash" class="crash" title="C">CRASH</button>
      </div>
      <div class="sep"></div>
      <button class="b" id="play" title="Space">❚❚ Pause</button>
      <div class="speed"><input id="speed" type="range" min="0" max="3" step="0.05" value="1"><span id="speedV">1.00x</span></div>
      <div class="chips" id="speedChips"><button data-s="0.1">0.1x</button><button data-s="0.25">0.25x</button><button data-s="0.5">0.5x</button><button data-s="1">1x</button><button data-s="2">2x</button></div>
      <div class="sep"></div>
      <div id="state"></div>
    </div>
  </div>

  <aside id="right">
    <div class="grp">
      <div class="lbl">Car B · from south <i style="background:#4ea1ff"></i></div>
      <div class="pv" id="pvB"><div class="tag" id="tagB"></div></div>
      <div class="chips" id="animsB"></div>
    </div>
    <div class="grp" style="margin-top:auto">
      <div class="lbl">Car B select</div>
      <div class="pick" id="pickB"></div>
    </div>
  </aside>
</div>
